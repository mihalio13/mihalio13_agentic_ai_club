# Render Blueprint для «Тусовки» (код у папці party/).
# Render → New → Blueprint → оберіть цей репозиторій.
databases:
  - name: tusovka-db
    plan: free
    databaseName: tusovka
    user: tusovka

services:
  - type: web
    name: tusovka
    runtime: python
    plan: free
    rootDir: party
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tusovka-db
          property: connectionString
      - key: TRUSTED_PROXY_COUNT
        value: "1"
