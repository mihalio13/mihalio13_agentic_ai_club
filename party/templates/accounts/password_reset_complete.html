{% extends "base.html" %}
{% block title %}Пароль змінено{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth-card">
    <div class="auth-head">
      <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
      <h1>Пароль змінено</h1>
      <p>Тепер можна увійти з новим паролем. Усі старі сесії завершено.</p>

    <a class="btn btn-primary btn-block btn-lg" href="{% url 'accounts:login' %}">Увійти</a>
  </div>
</div>
{% endblock %}
